run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert

issues:
  exclude-rules:
    # Test helpers intentionally ignore some errors for brevity.
    - path: _test\.go
      linters:
        - errcheck
