run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert

issues:
  exclude-rules:
    # Test helpers intentionally ignore some errors and use fixed-signature
    # HTTP/RPC callbacks whose unused parameters cannot be dropped.
    - path: _test\.go
      linters:
        - errcheck
        - revive
